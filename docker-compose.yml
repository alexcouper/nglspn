services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nglspn}
      POSTGRES_USER: ${POSTGRES_USER:-nglspn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nglspn}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: src/django-backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nglspn}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nglspn}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-}
      # S3 / Object Storage
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-fr-par}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-}
      S3_CDN_DOMAIN: ${S3_CDN_DOMAIN:-}
      SCW_ACCESS_KEY: ${SCW_ACCESS_KEY:-}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:-}
      # Email
      EMAIL_BACKEND: ${EMAIL_BACKEND:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      ADMIN_FROM_EMAIL: ${ADMIN_FROM_EMAIL:-}
      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-django-backend}

  web-ui:
    build:
      context: src/web-ui
      dockerfile: Dockerfile
      args:
        API_URL: http://backend:8000
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL:-}
      MAINTENANCE_BYPASS_SECRET: ${MAINTENANCE_BYPASS_SECRET:-}

volumes:
  postgres_data:
