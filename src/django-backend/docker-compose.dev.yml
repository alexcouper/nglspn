# Local dev services for `make dev` in src/django-backend.
# Runs a MinIO (S3-compatible) server + a one-shot bucket initializer so
# the presigned-URL upload flow works end-to-end without Scaleway.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
#
# `make dev` starts these automatically.

services:
  minio:
    image: minio/minio:latest
    container_name: nglspn-dev-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates the dev bucket and makes it anonymously readable so uploaded
  # images can be fetched directly by the browser via S3_PUBLIC_URL_BASE.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/naglasupan-dev &&
      mc anonymous set download local/naglasupan-dev
      "

volumes:
  minio_data:
